resources:
  jobs:
    bikemart_medallion_pipeline:
      name: "bikemart_medallion_pipeline_${bundle.target}"
      tasks:
        - task_key: bronze
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/bronze/01_bronze.sql

        - task_key: silver
          depends_on:
            - task_key: bronze
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02_silver.sql

        - task_key: gold
          depends_on:
            - task_key: silver
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/03_gold.sql

        - task_key: validate
          depends_on:
            - task_key: gold
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/validation/04_validate.sql
